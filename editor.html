<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; object-src 'none'; form-action 'none'; img-src 'self' data:; style-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js; connect-src 'self' https://ebufvcuxcypoxwbvcbjg.supabase.co">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Panel · MqR</title>
  <link rel="preconnect" href="https://ebufvcuxcypoxwbvcbjg.supabase.co" crossorigin>
  <link rel="stylesheet" href="profile.css?v=quick">
  <script type="module" src="editor.js?v=quick"></script>
</head>
<body>
  <div class="site editor-site">
    <header class="masthead">
      <a class="wordmark" href="./">MqR</a>
      <div class="masthead-actions"><a class="connect-button" href="./">View profile</a><button class="access-button" type="button" id="lock-editor" hidden>Lock</button></div>
    </header>
    <main class="editor-layout">
      <h1>Admin Panel</h1>
      <p class="editor-status" id="editor-status" role="status">Checking access…</p>
      <button class="connect-button" id="reload-profile" type="button" hidden>Load latest profile</button>
      <form id="profile-editor" method="post" hidden>
        <fieldset>
          <legend>Profile</legend>
          <div class="editor-pair">
            <label>Name <input id="edit-name" required maxlength="32"></label>
            <label>Display handle <input id="edit-handle" required maxlength="24"></label>
          </div>
          <label>Intro <textarea id="edit-note" required maxlength="150" rows="2"></textarea></label>
        </fieldset>
        <fieldset>
          <legend>Appearance</legend>
          <details class="preset-picker" open>
            <summary>Color presets</summary>
            <label class="preset-scope">Apply preset to
              <select id="preset-scope">
                <option value="full">Entire page</option>
                <option value="text">Intro, title &amp; social names</option>
              </select>
            </label>
            <div id="theme-presets" class="theme-presets" role="group" aria-label="Color presets"></div>
          </details>
          <div class="appearance-layout">
            <div class="appearance-controls">
              <label class="check-row"><input id="edit-ending-enabled" type="checkbox"> Show title ending</label>
              <label>Ending text <input id="edit-ending" autocomplete="off" spellcheck="false" placeholder=";"></label>
              <div class="range-row">
                <div><label for="edit-ending-delay">Ending delay</label><output id="ending-delay-value" for="edit-ending-delay" aria-hidden="true"></output></div>
                <input id="edit-ending-delay" type="range">
              </div>
              <div class="range-row">
                <div><label for="edit-word-spacing">Word spacing</label><output id="word-spacing-value" for="edit-word-spacing" aria-hidden="true"></output></div>
                <input id="edit-word-spacing" type="range">
              </div>
              <div class="range-row">
                <div><label for="edit-handle-gap">Gap before handle</label><output id="handle-gap-value" for="edit-handle-gap" aria-hidden="true"></output></div>
                <input id="edit-handle-gap" type="range">
              </div>
              <label class="check-row"><input id="edit-trail" type="checkbox"> Enable cursor trail</label>
              <div id="color-groups"></div>
              <button class="connect-button" id="reset-colors" type="button">Reset colors</button>
            </div>
            <section class="appearance-preview" aria-label="Live preview">
              <div class="preview-tools"><span>Live preview</span>
                <button class="connect-button" id="replay-title" type="button">Replay typing</button>
              </div>
              <div class="preview-frame" id="theme-preview">
                <div class="preview-surface">
                  <canvas class="cursor-trail" id="preview-trail" aria-hidden="true" hidden></canvas>
                  <div class="masthead preview-nav" aria-hidden="true">
                    <span class="wordmark">MqR</span>
                    <span class="masthead-actions"><span class="connect-button">Connect</span><span class="access-button">Access</span></span>
                  </div>
                  <div class="intro preview-intro">
                    <h2 class="profile-title" id="edit-title-preview"></h2>
                    <p><span class="comment-marker" aria-hidden="true">// </span><span id="preview-note"></span></p>
                  </div>
                  <div class="profiles" id="preview-social">
                    <h2>Social profiles</h2>
                    <ul class="profile-list" id="preview-accounts"></ul>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </fieldset>
        <fieldset>
          <legend>Social profiles</legend>
          <div id="edit-links"></div>
        </fieldset>
        <button class="access-button" id="save-profile" type="submit">Save profile</button>
      </form>
      <section id="devices-panel" hidden aria-labelledby="devices-heading">
        <h2 id="devices-heading">Remembered devices</h2>
        <p id="devices-status" role="status"></p>
        <ul id="device-list"></ul>
      </section>
    </main>
  </div>
</body>
</html>
