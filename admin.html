<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MqMr OS · Admin</title>
<style>body{margin:0;background:#0b1020;color:#e2e8f0;font:16px system-ui}main{max-width:980px;margin:48px auto;padding:24px}a{color:#93c5fd}button,select{font:inherit;padding:12px;border:1px solid #475569;border-radius:8px;margin:8px 8px 8px 0}button{cursor:pointer;background:#dbeafe}textarea{box-sizing:border-box;width:100%;min-height:55vh;background:#111b30;color:#e2e8f0;border:1px solid #475569;border-radius:12px;padding:20px;font:14px/1.6 monospace}#status{min-height:24px}label{display:block}[hidden]{display:none!important}</style></head>
<body><main><a href="index.html">← Desktop</a><h1>Site administration</h1><p>Manage shared content across Desktop, Simple and Phone. Changes become visible on reload.</p>
<p id="status" role="status">Checking your session…</p><button id="login" hidden>Sign in with Google</button><button id="logout" hidden>Sign out</button>
<section id="editor" hidden><label for="document">Content document</label><select id="document"><option>main-data.json</option><option>Apps/AboutMe.json</option><option>Apps/Projects.json</option><option>Apps/Workspace.json</option><option>Apps/Contact.json</option><option>Apps/Settings.json</option><option>Apps/Terminal.json</option></select><button id="load">Reload document</button><label for="content">Content (JSON)</label><textarea id="content" spellcheck="false"></textarea><button id="save">Publish content</button><p>Keep the existing field names and structure. Download a backup before editing.</p><button id="backup">Download document backup</button></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script><script src="site-backend.js"></script><script src="admin.js"></script></body></html>
