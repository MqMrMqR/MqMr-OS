<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; object-src 'none'; form-action 'none'; img-src 'self' data:; style-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js; connect-src 'self' https://ebufvcuxcypoxwbvcbjg.supabase.co">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ethan {MqMr} on GitHub, Instagram, YouTube, X and Discord.">
  <meta name="theme-color" content="#141414">
  <title>Ethan {MqMr};</title>
  <link rel="icon" href="profiles/mqmr.webp" type="image/webp">
  <link rel="preconnect" href="https://ebufvcuxcypoxwbvcbjg.supabase.co" crossorigin>
  <link rel="stylesheet" href="profile.css?v=quick">
  <script type="module" src="access.js?v=quick"></script>
  <script type="module" src="profile-page.js?v=themes"></script>
</head>
<body>
  <div class="site profile-home">
    <canvas id="cursor-trail" class="cursor-trail" aria-hidden="true" hidden></canvas>
    <header class="masthead">
      <a class="wordmark" href="./">MqR</a>
      <div class="masthead-actions">
        <button class="connect-button" type="button" id="open-connect">Connect</button>
        <button class="access-button" type="button" id="open-access">Access</button>
      </div>
    </header>

    <main class="layout">
      <section class="intro" aria-labelledby="name">
        <img class="portrait" src="profiles/youtube.webp" alt="" width="76" height="76">
        <h1 id="name" class="profile-title"><span class="name-text">Ethan</span><span class="title-gap"> </span><span class="name-alias"><span class="name-brace">{</span><span class="name-handle">MqMr</span><span class="name-brace">}</span><span class="name-ending">;</span></span></h1>
        <p><span class="comment-marker" aria-hidden="true">// </span><span id="profile-note">Around the internet.</span></p>
      </section>

      <section class="profiles" aria-labelledby="profiles-title">
        <h2 id="profiles-title">Social profiles</h2>
        <ul class="profile-list">
          <li><a href="https://github.com/MqMrMqR" class="profile" data-profile="github">
            <img class="profile-photo" src="profiles/mqmr.webp" alt="" width="44" height="44">
            <span><strong>@MqMrMqR</strong><small><i class="platform-logo logo-github" aria-hidden="true"></i>GitHub</small></span>
          </a></li>
          <li><a href="https://www.instagram.com/_.wp1/" class="profile" data-profile="instagram">
            <img class="profile-photo" src="profiles/instagram.webp" alt="" width="44" height="44">
            <span><strong>@_.wp1</strong><small><i class="platform-logo logo-instagram" aria-hidden="true"></i>Instagram</small></span>
          </a></li>
          <li><a href="https://www.youtube.com/@MqMr" class="profile" data-profile="youtube">
            <img class="profile-photo" src="profiles/youtube.webp" alt="" width="44" height="44">
            <span><strong>@MqMr</strong><small><i class="platform-logo logo-youtube" aria-hidden="true"></i>YouTube</small></span>
          </a></li>
          <li><a href="https://x.com/mqmrmqr" class="profile" data-profile="x">
            <img class="profile-photo" src="profiles/x.webp" alt="" width="44" height="44">
            <span><strong>@mqmrmqr</strong><small><i class="platform-logo logo-x" aria-hidden="true"></i>X</small></span>
          </a></li>
          <li><a href="https://discord.com/users/1367578118830817420" class="profile" data-profile="discord">
            <img class="profile-photo" src="profiles/youtube.webp" alt="" width="44" height="44">
            <span><strong hidden>Discord</strong><small><i class="platform-logo logo-discord" aria-hidden="true"></i>Discord</small></span>
          </a></li>
        </ul>
      </section>
    </main>
  </div>

  <dialog id="access" aria-labelledby="access-title">
    <div class="dialog-heading">
      <h2 id="access-title">Private inbox</h2>
      <button class="close-button" id="close-access" type="button" aria-label="Close">×</button>
    </div>
    <p id="access-hint" class="dialog-hint" hidden></p>
    <form id="access-form" method="post">
      <div id="email-field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>
      <label for="password" id="password-label">Password</label>
      <input type="password" id="password" autocomplete="current-password" maxlength="1024" required>
      <label class="check-row" id="remember-field" hidden><input type="checkbox" id="remember-device"> Remember this device for 14 days</label>
      <button class="access-button unlock-button" id="unlock" type="submit">Continue</button>
    </form>
    <button class="access-button unlock-button" id="enroll" type="button" hidden>Set up authenticator</button>
    <form id="verify-form" method="post" hidden>
      <div id="authenticator-setup" hidden>
        <p>Scan this code with an authenticator app. You’ll use that app to sign in next time.</p>
        <img id="authenticator-qr" alt="Authenticator setup QR code" width="160" height="160">
        <details><summary>Enter the setup key manually</summary><p><code id="authenticator-key"></code></p></details>
      </div>
      <label for="verification-code">Verification code</label>
      <input type="text" id="verification-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
      <button class="access-button unlock-button" id="verify" type="submit">Verify</button>
    </form>
    <p id="access-status" class="access-status" role="status"></p>
  </dialog>
</body>
</html>
