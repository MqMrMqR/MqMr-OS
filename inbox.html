<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; object-src 'none'; form-action 'none'; img-src 'self' data: blob: https:; style-src 'self' https://accounts.google.com/gsi/style; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js https://accounts.google.com/gsi/client; connect-src 'self' https://ebufvcuxcypoxwbvcbjg.supabase.co https://gmail.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#141414">
  <title>Inbox · MqR</title>
  <link rel="preconnect" href="https://ebufvcuxcypoxwbvcbjg.supabase.co" crossorigin>
  <link rel="stylesheet" href="inbox.css?v=inbox-media-1">
</head>
<body>
  <section class="mailbox-gate" id="mailbox-gate" aria-labelledby="gate-title">
    <h1 id="gate-title">Private inbox</h1>
    <p id="gate-status" role="status">Checking access…</p>
    <a href="index.html?access=1">Return to Access</a>
  </section>

  <div class="mail-app" id="mailbox" hidden>
    <div class="mobile-mail-bar">
      <button id="open-folders" type="button" aria-haspopup="dialog" aria-controls="mobile-mailboxes" aria-expanded="false">Mailboxes</button>
      <span>Inbox</span>
      <button id="mobile-compose" type="button" class="primary" disabled>Compose</button>
    </div>
    <aside class="mail-sidebar" aria-label="Mailbox settings">
      <div class="mail-brand"><a href="index.html">MqR</a><strong>Inbox</strong></div>
      <button id="compose" class="primary" disabled>New message</button>
      <h2>Mailboxes</h2>
      <nav id="folders" aria-label="Mailboxes"></nav>
      <h2>Accounts</h2>
      <div id="accounts"></div>
      <button id="connect">Add Google account</button>
      <button id="aliases" hidden>Manage addresses</button>
      <button id="disconnect" disabled>Disconnect account</button>
      <div class="sidebar-footer">
        <button id="sign-out">Lock inbox</button>
        <a href="privacy.html" target="_blank" rel="noopener">Privacy</a>
      </div>
    </aside>

    <main class="mail-main">
      <header class="mail-toolbar">
        <div class="mail-heading">
          <h1 id="mailbox-title">Inbox</h1>
          <span id="mailbox-count"></span>
        </div>
        <span class="preview-label" id="preview-label" hidden>Sample messages</span>
        <input id="search" type="search" placeholder="Search mail" aria-label="Search mail">
        <button id="refresh" aria-label="Refresh mail">↻</button>
      </header>
      <p id="mail-status" role="status"></p>
      <div class="mail-split">
        <section class="message-list" aria-label="Messages">
          <div id="messages"></div>
          <button id="more" hidden>Load more</button>
        </section>
        <div class="reader-pane">
          <button id="back-to-list" type="button">Back to messages</button>
          <article class="message-reader" id="reader"><p class="mail-empty">Select a message to read it.</p></article>
        </div>
      </div>
    </main>

    <dialog id="mobile-mailboxes" aria-labelledby="mobile-folders-title">
      <header><h2 id="mobile-folders-title">Mailboxes</h2><button type="button" id="close-folders" aria-label="Close mailboxes">×</button></header>
    </dialog>

    <dialog id="compose-dialog" aria-labelledby="compose-title">
      <form id="compose-form" method="post">
        <header><h2 id="compose-title">New message</h2><button type="button" id="close-compose" aria-label="Close composer">×</button></header>
        <label>From <select id="from" required></select></label>
        <label>To <input id="to" type="email" required></label>
        <label>Subject <input id="subject" maxlength="998" required></label>
        <div class="compose-editor">
          <div id="format-toolbar" class="format-toolbar" role="group" aria-label="Message formatting">
            <button type="button" data-command="bold" aria-label="Bold" aria-pressed="false"><b>B</b></button>
            <button type="button" data-command="italic" aria-label="Italic" aria-pressed="false"><i>I</i></button>
            <button type="button" data-command="underline" aria-label="Underline" aria-pressed="false"><u>U</u></button>
            <button type="button" data-command="insertUnorderedList" aria-label="Bulleted list" aria-pressed="false">• List</button>
            <button type="button" data-command="insertOrderedList" aria-label="Numbered list" aria-pressed="false">1. List</button>
            <button type="button" data-command="link" aria-label="Insert link">Link</button>
            <button type="button" data-command="removeFormat" aria-label="Clear formatting">Clear</button>
          </div>
          <div id="link-panel" class="link-panel" hidden>
            <label>Link URL <input inputmode="url" placeholder="https://example.com"></label>
            <button type="button" data-insert-link>Insert</button>
            <button type="button" data-cancel-link>Cancel</button>
            <p role="status"></p>
          </div>
          <div id="body" role="textbox" contenteditable="true" aria-label="Message" aria-multiline="true" aria-required="true" data-placeholder="Write your message…" dir="auto"></div>
        </div>
        <label>Attachments <input id="attachments" type="file" multiple></label>
        <p id="compose-status" role="status"></p>
        <footer><button type="submit" class="primary" id="send">Send message</button></footer>
      </form>
    </dialog>

    <dialog id="alias-dialog" aria-labelledby="alias-title">
      <header><h2 id="alias-title">Domain addresses</h2><button id="close-aliases" aria-label="Close addresses">×</button></header>
      <p>Add a sending address for this inbox.</p>
      <ul id="alias-list"></ul>
      <form id="alias-form" method="post">
        <label>New address <input id="alias-name" pattern="[A-Za-z0-9][A-Za-z0-9._+\-]{0,63}" placeholder="hello" required></label>
        <button class="primary">Add address</button>
      </form>
      <p id="alias-status" role="status"></p>
    </dialog>
    <dialog id="image-dialog" aria-labelledby="image-title">
      <header><h2 id="image-title">Image preview</h2><button type="button" id="close-image" aria-label="Close image preview">×</button></header>
      <p id="image-status" role="status"></p>
      <div id="image-preview"></div>
    </dialog>
  </div>
  <script src="inbox-config.js"></script>
  <script src="mail-core.js?v=inbox-media-1"></script>
  <script type="module" src="private-inbox.js?v=inbox-media-1"></script>
</body>
</html>
